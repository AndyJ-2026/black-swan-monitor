name: Send Lark Alert

on:
  workflow_dispatch:
    inputs:
      header_title:
        description: 'Card header title'
        required: true
      header_color:
        description: 'Card header color (red/orange/green)'
        required: true
        default: 'orange'
      report:
        description: 'Markdown report content'
        required: true
  push:
    paths:
      - 'reports/latest.json'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Send to Lark webhook
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK_URL }}
        run: |
          python3 -c "
          import json, os, urllib.request, sys

          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              with open('reports/latest.json', 'r') as f:
                  data = json.load(f)
              header_title = data['header_title']
              header_color = data['header_color']
              report = data['report']
          else:
              header_title = '''${{ inputs.header_title }}'''
              header_color = '''${{ inputs.header_color }}'''
              report = '''${{ inputs.report }}'''

          card = {
              'msg_type': 'interactive',
              'card': {
                  'header': {
                      'title': {'tag': 'plain_text', 'content': header_title},
                      'template': header_color
                  },
                  'elements': [{'tag': 'markdown', 'content': report}]
              }
          }

          data = json.dumps(card, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              os.environ['LARK_WEBHOOK'],
              data=data,
              headers={'Content-Type': 'application/json'}
          )
          resp = urllib.request.urlopen(req)
          result = resp.read().decode()
          print(result)
          if '\"code\":0' not in result:
              sys.exit(1)
          "
