name: Black Swan Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate only, do not send to Lark or commit state"
        required: false
        default: "false"
      mode:
        description: "Scanner mode: x_batches, twitter_legacy, contract, or both_legacy"
        required: false
        default: "x_batches"
      pool:
        description: "X batch pool: priority, stable, or all"
        required: false
        default: "priority"
      scan_limit:
        description: "Number of token Twitter accounts / contracts to scan"
        required: false
        default: "0"
      scan_buckets:
        description: "Split project accounts into N buckets to reduce X rate-limit risk"
        required: false
        default: "3"
      batch_size:
        description: "X batch scanner batch size"
        required: false
        default: "40"
      max_batches:
        description: "Maximum X batches to run; 0 means all"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: black-swan-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: ${{ github.event.inputs.mode == 'twitter_legacy' || github.event.inputs.mode == 'both_legacy' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ github.event.inputs.mode == 'twitter_legacy' || github.event.inputs.mode == 'both_legacy' }}
        run: python -m pip install --upgrade requests

      - name: Setup Node
        if: ${{ github.event.inputs.mode == 'contract' || github.event.inputs.mode == 'both_legacy' || github.event.inputs.mode == 'x_batches' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run X batch monitor
        if: ${{ github.event.inputs.mode == 'x_batches' || github.event.inputs.mode == '' }}
        env:
          BSM_X_BATCH_SIZE: ${{ github.event.inputs.batch_size || '40' }}
          BSM_X_MAX_BATCHES: ${{ github.event.inputs.max_batches || '0' }}
          BSM_X_RUN_LOG_DIR: reports/x-run-logs
          BSM_X_OUTPUT_DIR: reports/x-batches
          BSM_X_BATCH_COOLDOWN_MS: "30000"
          BSM_X_RETRY_COOLDOWN_MS: "60000"
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          args=("--write-state")
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args=()
          fi
          if [ "${{ github.event.inputs.pool || 'priority' }}" = "stable" ]; then
            args+=("--stable")
          elif [ "${{ github.event.inputs.pool || 'priority' }}" = "all" ]; then
            args+=("--all")
          fi
          if [ -n "${MINIMAX_API_KEY}" ]; then
            args+=("--minimax")
          fi
          node x_scan_batches.mjs "${args[@]}"

      - name: Run Twitter risk monitor
        if: ${{ github.event.inputs.mode == 'twitter_legacy' || github.event.inputs.mode == 'both_legacy' }}
        env:
          BSM_SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '0' }}
          BSM_SCAN_BUCKETS: ${{ github.event.inputs.scan_buckets || '3' }}
          BSM_MAX_WORKERS: "8"
          BSM_SEND_LARK: "true"
          BSM_RELAY_URL: ${{ secrets.BSM_RELAY_URL }}
          BSM_RELAY_SECRET: ${{ secrets.BSM_RELAY_SECRET }}
          BSM_LARK_WEBHOOK_URL: ${{ secrets.BSM_LARK_WEBHOOK_URL || secrets.LARK_WEBHOOK_URL }}
          BSM_LARK_WEBHOOK_SECRET: ${{ secrets.BSM_LARK_WEBHOOK_SECRET }}
          BSM_X_COOKIES_JSON: ${{ secrets.BSM_X_COOKIES_JSON }}
        run: |
          args=("--limit" "${BSM_SCAN_LIMIT}" "--buckets" "${BSM_SCAN_BUCKETS}" "--send")
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args+=("--dry-run")
          fi
          python risk_monitor.py "${args[@]}"

      - name: Run contract risk monitor
        if: ${{ github.event.inputs.mode == 'contract' || github.event.inputs.mode == 'both_legacy' }}
        env:
          BSM_SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '0' }}
          BSM_SEND_LARK: "true"
          BSM_RELAY_URL: ${{ secrets.BSM_RELAY_URL }}
          BSM_RELAY_SECRET: ${{ secrets.BSM_RELAY_SECRET }}
          BSM_LARK_WEBHOOK_URL: ${{ secrets.BSM_LARK_WEBHOOK_URL || secrets.LARK_WEBHOOK_URL }}
          BSM_LARK_WEBHOOK_SECRET: ${{ secrets.BSM_LARK_WEBHOOK_SECRET }}
        run: |
          args=("--limit" "${BSM_SCAN_LIMIT}" "--send")
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args+=("--dry-run")
          fi
          node contract_scan.mjs "${args[@]}"

      - name: Commit monitor state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- sent_events.json reports/latest.json contract_state.json x_scan_state.json reports/x-batches reports/x-run-logs)" ]; then
            echo "No monitor state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_events.json reports/latest.json contract_state.json x_scan_state.json reports/x-batches reports/x-run-logs
          git commit -m "Update black swan monitor state"
          git push
