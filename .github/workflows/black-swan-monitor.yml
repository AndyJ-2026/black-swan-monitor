name: Black Swan Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate only, do not send to Lark or commit state"
        required: false
        default: "false"
      scan_limit:
        description: "Number of token Twitter accounts to scan"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: black-swan-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Run monitor
        env:
          BSM_SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '120' }}
          BSM_MAX_WORKERS: "8"
          BSM_SEND_LARK: "true"
          BSM_RELAY_URL: ${{ secrets.BSM_RELAY_URL }}
          BSM_RELAY_SECRET: ${{ secrets.BSM_RELAY_SECRET }}
          BSM_LARK_WEBHOOK_URL: ${{ secrets.BSM_LARK_WEBHOOK_URL || secrets.LARK_WEBHOOK_URL }}
          BSM_LARK_WEBHOOK_SECRET: ${{ secrets.BSM_LARK_WEBHOOK_SECRET }}
        run: |
          args=("--limit" "${BSM_SCAN_LIMIT}" "--send")
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args+=("--dry-run")
          fi
          python risk_monitor.py "${args[@]}"

      - name: Commit monitor state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- sent_events.json reports/latest.json)" ]; then
            echo "No monitor state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_events.json reports/latest.json
          git commit -m "Update black swan monitor state"
          git push
